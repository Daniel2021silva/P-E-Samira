<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyFlow Escolar</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<aside class="sidebar">
  <div class="brand">
    <div class="logo">SF</div>
    <div>
      <h1>StudyFlow</h1>
      <span>Agenda inteligente</span>
    </div>
  </div>

  <nav>
    <button class="nav-btn active" data-page="dashboard">🏠 Início</button>
    <button class="nav-btn" data-page="agenda">📅 Agenda</button>
    <button class="nav-btn" data-page="anotacoes">📝 Anotações</button>
    <button class="nav-btn" data-page="cronograma">📚 Cronograma</button>
    <button class="nav-btn" data-page="desempenho">📊 Desempenho</button>
    <button class="nav-btn" data-page="ia">🤖 IA</button>
  </nav>
</aside>

<main class="main">

<header class="topbar">
  <div>
    <h2 id="pageTitle">Dashboard</h2>
    <p>2º ano • PAVE • ENEM</p>
  </div>
  <button class="primary" onclick="abrirModalTarefa()">+ Nova tarefa</button>
</header>

<!-- DASHBOARD -->
<section id="dashboard" class="page active">

<div class="cards">
  <div class="card destaque">
    <span>Pendentes</span>
    <strong id="totalPendentes">0</strong>
  </div>
  <div class="card">
    <span>Anotações</span>
    <strong id="totalAnotacoes">0</strong>
  </div>
  <div class="card">
    <span>Hoje</span>
    <strong id="tarefasHoje">0</strong>
  </div>
  <div class="card">
    <span>Concluídas</span>
    <strong id="totalConcluidas">0</strong>
  </div>
</div>

<div class="panel">
  <h3>Próximas tarefas</h3>
  <div id="listaDashboard" class="list"></div>
</div>

</section>

<!-- AGENDA -->
<section id="agenda" class="page">
<div class="panel">

<h3>Agenda Escolar</h3>

<div class="filters">
  <select id="filtroCategoria"></select>
  <select id="filtroStatus"></select>
  <select id="filtroMateria"></select>
  <input id="buscaTarefa" placeholder="Buscar...">
</div>

<div id="listaTarefas" class="list"></div>

</div>
</section>

<!-- ANOTAÇÕES -->
<section id="anotacoes" class="page">
<div class="panel">

<h3>Anotações</h3>

<form id="formNota">
  <input id="notaTitulo" placeholder="Título">
  <textarea id="notaTexto" placeholder="Digite..."></textarea>
  <button class="primary">Salvar</button>
</form>

<div id="listaNotas"></div>

</div>
</section>

<!-- CRONOGRAMA -->
<section id="cronograma" class="page">
<div class="panel">
<h3>Cronograma</h3>
<p>Seu cronograma aparece aqui.</p>
</div>
</section>

<!-- DESEMPENHO -->
<section id="desempenho" class="page">
<div class="panel">
<h3>Desempenho</h3>
<p>Acompanhe seu progresso.</p>
</div>
</section>

<!-- IA -->
<section id="ia" class="page">
<div class="panel">
<h3>Assistente IA</h3>

<textarea id="promptIA"></textarea>
<button class="primary" onclick="perguntarIA()">Perguntar</button>

<div id="respostaIA"></div>

</div>
</section>

</main>

<!-- MODAL -->
<div id="modalTarefa" class="modal">
<div class="modal-card">

<form id="formTarefa">

<input id="tarefaTitulo" placeholder="Título">
<input type="date" id="tarefaData">

<button class="primary">Salvar</button>

</form>

</div>
</div>

<script src="app.js"></script>

</body>
</html>
